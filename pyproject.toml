[project]
name = "sql-query-agent"
version = "0.1.0"
description = "Local, offline text-to-SQL agent over a dbt-modelled DuckDB e-commerce warehouse"
readme = "README.md"
authors = [
    { name = "Isaac", email = "isaacte88@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    # Core data tools
    "duckdb==1.1.3",
    "pandas==2.2.3",
    "faker==26.0.0",
    "numpy<2.0.0",
    # dbt
    "dbt-core==1.8.8",
    "dbt-duckdb==1.8.2",
    # AI / Text-to-SQL
    "vanna==0.7.4",
    "ollama==0.3.3",
    "chromadb==0.4.24",
    # UI
    "streamlit==1.38.0",
    # Utilities
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
]

[project.scripts]
sql-query-agent = "sql_query_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
