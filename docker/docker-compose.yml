# Run from the repo root:  docker compose -f docker/docker-compose.yml up -d --build
# (or from this folder:   docker compose up -d --build)
name: sql-query-agent

x-env-file: &env-file
  # Optional project-level .env (repo root), e.g. SQA_OLLAMA_MODEL=qwen2.5-coder:3b
  env_file:
    - path: ../.env
      required: false

services:
  ollama:
    image: ollama/ollama:0.12.3
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: downloads the model into the shared volume and preloads it in
  # memory (so the first question doesn't pay the multi-minute CPU load), then exits.
  ollama-pull:
    image: ollama/ollama:0.12.3
    <<: *env-file
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODEL="$${SQA_OLLAMA_MODEL:-llama3.1}"
        ollama pull "$$MODEL" && ollama run "$$MODEL" --keepalive 1h "Reply with OK" >/dev/null
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *env-file
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  # Only the model is persisted (5 GB, slow to re-download). The warehouse and
  # vector store are rebuilt whenever the frontend container is recreated, so
  # they always match the dbt models / semantic layer baked into the image.
  ollama-models:
